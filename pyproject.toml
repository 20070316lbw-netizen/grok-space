[project]
name = "sp500-trend"
version = "0.1.0"
description = "S&P 500 线性趋势扫描（trend_scan）与 Bocharov & Thiesson (2012) ART 论文复现（paper_repro）"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.31",
    "lxml>=5.0",
    "yfinance>=0.2.50",
    "pyarrow>=15.0",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
]

[project.scripts]
trend-scan = "trend_scan.cli:main"
paper-repro = "paper_repro.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trend_scan", "src/paper_repro"]
